version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgres://postgres:password@db:5432/devopsdb
    depends_on:
      - db

  db:
    image: postgres:14
    ports:
      - "5432:5432" #expose to host
    environment:
      POSTGRES_USER: postgres 
      POSTGRES_PASSWORD: password
      POSTGRES_DB: devopsdb